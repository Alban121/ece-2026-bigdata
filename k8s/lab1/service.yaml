apiVersion: v1
kind: Service
metadata:
  name: kubernetes-bootcamp-service
spec:
  type: NodePort
  selector:
    app: kubernetes-bootcamp   # TO COMPLETE : le Service cible les pods portant ce label
  ports:
    - port: 8080               # TO COMPLETE : port du Service
      targetPort: 8080         # port du conteneur (facultatif ici car identique)
